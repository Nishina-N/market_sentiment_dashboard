<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F5F3EF;
      --surface:   #EDEAE4;
      --border:    #D6D1C8;
      --ink:       #2A2720;
      --ink-muted: #7A7468;
      --accent:    #1A1A1A;
      --up:        #2D7A4F;
      --down:      #B84040;
      --header-h:  48px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }

    header .timestamp {
      font-size: 11px;
      color: var(--ink-muted);
      letter-spacing: 0.05em;
      margin-left: auto;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      /* 4行 × widget height。各セルはビューポートの半分弱を縦に使う */
    }

    .cell {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .cell-label {
      height: 28px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cell-label .sym {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cell-label .desc {
      font-size: 10px;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }

    .widget-wrap {
      flex: 1;
      /* ウィジェット自体の高さを画面高さ基準で設定 */
      height: calc((100vh - var(--header-h)) / 2 - 28px);
      min-height: 200px;
      overflow: hidden;
    }

    .widget-wrap iframe,
    .widget-wrap > div {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }
  </style>
</head>

<script>
  function updateTime() {
    const now = new Date();
    const opts = { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const ny = now.toLocaleTimeString('en-US', opts);
    document.getElementById('ts').textContent = 'NYSE ' + ny + ' ET';
  }
  updateTime();
  setInterval(updateTime, 1000);
</script>
